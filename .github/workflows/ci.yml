name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Verify zero external dependencies
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run unit & race tests
        run: go test -v -race ./...

      - name: Run engine fuzz testing
        shell: bash
        run: go test -v -fuzz=FuzzEngineEvaluate -fuzztime=10s ./pkg/engine